# DQX Rule Configuration - Batch - Sales Transactions
# Each rule maps to a column check. DQX applies these and tags failing rows.

rules:
  - name: division_allowlist
    column: division
    type: is_in_list
    allowed_values: ["011", "012", "013"]
    criticality: error
    message: "Division not in approved allowlist"

  - name: customer_id_not_null
    column: customer_id
    type: is_not_null
    criticality: error
    message: "Customer ID must not be null"

  - name: quantity_positive
    column: quantity
    type: min_value
    min: 1
    criticality: error
    message: "Quantity must be at least 1"

  - name: unit_price_positive
    column: unit_price
    type: min_value
    min: 0.01
    criticality: error
    message: "Unit price must be greater than 0"

  - name: transaction_date_format
    column: transaction_date
    type: matches_regex
    regex: "^\\d{4}-\\d{2}-\\d{2}$"
    criticality: warning
    message: "Transaction date format invalid"

  - name: coupon_division_integrity
    column: division
    type: custom_sql
    sql_expression: "NOT (coupon_applied = true AND division = '540')"
    criticality: error
    message: "Coupon records from division 540 are not permitted"