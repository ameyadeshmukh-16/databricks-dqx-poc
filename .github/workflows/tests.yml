name: tests

# Runs the unit tests on every push to main and on every pull request.
# They need no Databricks access or secrets: Spark-dependent code is mocked at the boundary.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        run: pip install -r requirements-ci.txt

      # tests/test_profiler.py needs a local Spark session, so it is left out here.
      - name: Run unit tests
        run: python -m pytest tests -q --ignore=tests/test_profiler.py
