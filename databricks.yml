# Databricks Asset Bundle — databricks-dqx-poc
# See https://docs.databricks.com/dev-tools/bundles/index.html

bundle:
  name: databricks-dqx-poc

variables:
  cluster_id:
    description: "Databricks cluster ID to run jobs on"
    default: "1026-013008-6rqlr2d7"
  streaming_max_runtime_seconds:
    description: "Hard cap on one run of the streaming job (cost guard): the run and every task are stopped after this long"
    default: 900
  pipeline_libraries:
    description: "PyPI libraries installed on the cluster for every task"
    type: complex
    default:
      - pypi:
          package: databricks-labs-dqx>=0.5.0
      - pypi:
          package: pyyaml>=6.0.0
      - pypi:
          package: python-dotenv>=1.0.0
      - pypi:
          package: confluent-kafka>=2.3.0
      - pypi:
          package: azure-storage-file-datalake>=12.14.0
      - pypi:
          package: anthropic>=0.25.0
      - pypi:
          package: openai>=1.0.0

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405615968854762.2.azuredatabricks.net

  ## Optionally, there could be 'staging' or 'prod' targets here.
  #
  # prod:
  #   workspace:
  #     host: https://adb-7405615968854762.2.azuredatabricks.net

resources:
  jobs:
    rtm_kafka_streaming:
      name: "[RTM] Kafka Streaming Pipeline"
      # One-click demo pipeline:
      #   seed_rules -> stream_and_validate, produce_events,
      #                 suggest_rules_continuously, live_monitor
      # The four long-running tasks start together once the rules are seeded and
      # coordinate through tables (the stream never finishes, so nothing can
      # depend on it). The job-level cap below stops the whole run — "Timed out"
      # is the expected final status, and it prevents a forgotten run billing.
      timeout_seconds: ${var.streaming_max_runtime_seconds}
      tasks:
        - task_key: seed_rules
          # Idempotent: rule sets that already have rows are skipped, so approved
          # rules are never overwritten; on an empty catalog this creates the
          # schema and the rules registry.
          spark_python_task:
            python_file: ./notebooks/seed_rules_registry.py
            parameters:
              - "--force=false"
          existing_cluster_id: ${var.cluster_id}
          libraries: ${var.pipeline_libraries}

        - task_key: stream_and_validate
          depends_on:
            - task_key: seed_rules
          spark_python_task:
            python_file: ./notebooks/kafka_stream_dqx_validation.py
          existing_cluster_id: ${var.cluster_id}
          libraries: ${var.pipeline_libraries}
          timeout_seconds: 0    # run indefinitely until stopped

        - task_key: produce_events
          # Depends only on the seed: stream_and_validate never terminates, so
          # depends_on it would never fire. produce_events polls a readiness
          # signal (stream_consumer_ready) written by the consumer once it is
          # actually listening, before it sends any events.
          depends_on:
            - task_key: seed_rules
          spark_python_task:
            python_file: ./notebooks/kafka_producer_job.py
            parameters:
              - "--num_events=0"      # 0 = run until the job is stopped
              - "--batch_size=20"
              - "--interval_seconds=5"
          existing_cluster_id: ${var.cluster_id}
          libraries: ${var.pipeline_libraries}

        - task_key: suggest_rules_continuously
          # Waits for the quarantine table to fill, then keeps staging NEW rule
          # suggestions for human review every few minutes and records a review
          # notification.
          depends_on:
            - task_key: seed_rules
          spark_python_task:
            python_file: ./notebooks/streaming_rule_suggester.py
            parameters:
              - "--interval_seconds=90"
              - "--min_rows=60"
              - "--min_new_rows=30"
              - "--max_new=5"
              - "--llm_backend=openrouter"
          existing_cluster_id: ${var.cluster_id}
          libraries: ${var.pipeline_libraries}

        - task_key: live_monitor
          # Prints a fresh status snapshot every 45 s (event flow, active rules,
          # rules firing, pending suggestions, notifications) so the whole loop
          # can be followed from this task's output. Read-only.
          depends_on:
            - task_key: seed_rules
          spark_python_task:
            python_file: ./notebooks/live_monitor.py
            parameters:
              - "--interval_seconds=45"
              - "--run_config_name=streaming_event_rules"
              - "--last_batches=5"
          existing_cluster_id: ${var.cluster_id}
          libraries: ${var.pipeline_libraries}

    rtm_seed_rules:
      name: "[RTM] Seed Rules Registry"
      tasks:
        - task_key: seed_rules
          spark_python_task:
            python_file: ./notebooks/seed_rules_registry.py
            parameters:
              - "--force=false"
          existing_cluster_id: ${var.cluster_id}
          libraries: ${var.pipeline_libraries}

    rtm_review_rule:
      name: "[RTM] Review Rule"
      timeout_seconds: 300
      # Click "Run now with different parameters" to approve or reject a suggestion.
      parameters:
        - name: action
          default: "list"          # list | approve | reject
        - name: rule
          default: ""              # rule name (or rule_id) from the pending list
        - name: run_config_name
          default: "streaming_event_rules"
      tasks:
        - task_key: review
          spark_python_task:
            python_file: ./notebooks/review_rule.py
            parameters:
              - "--action={{job.parameters.action}}"
              - "--rule={{job.parameters.rule}}"
              - "--run_config_name={{job.parameters.run_config_name}}"
          existing_cluster_id: ${var.cluster_id}
          libraries: ${var.pipeline_libraries}

    rtm_status:
      name: "[RTM] Live Status"
      timeout_seconds: 300
      tasks:
        - task_key: snapshot
          spark_python_task:
            python_file: ./notebooks/status_snapshot.py
            parameters:
              - "--run_config_name=streaming_event_rules"
              - "--last_batches=5"
          existing_cluster_id: ${var.cluster_id}
          libraries: ${var.pipeline_libraries}

    rtm_batch_pipeline:
      name: "[RTM] Batch DQX Pipeline"
      tasks:
        - task_key: stage_data
          spark_python_task:
            python_file: ./notebooks/setup_delta_tables.py
            parameters:
              - "--csv_path=abfss://databricks-dqx@databricksdqxpocstorage.dfs.core.windows.net/sales_transactions.csv"
              - "--database=retail_dqx_poc"
          existing_cluster_id: ${var.cluster_id}
          libraries: ${var.pipeline_libraries}

        - task_key: validate_data
          depends_on:
            - task_key: stage_data
          spark_python_task:
            python_file: ./notebooks/batch_dqx_validation.py
            parameters:
              - "--database=retail_dqx_poc"
          existing_cluster_id: ${var.cluster_id}
          libraries: ${var.pipeline_libraries}

        - task_key: suggest_rules
          depends_on:
            - task_key: validate_data
          notebook_task:
            notebook_path: ./notebooks/ai_rule_suggester.py
            base_parameters:
              source_table: "dqx_poc_dev.retail_dqx_poc.sales_staging"
              run_config_name: "sales_batch_rules"
              context_description: "Retail POS sales transactions from brick-and-mortar stores"
              llm_backend: "openrouter"
          existing_cluster_id: ${var.cluster_id}
          libraries: ${var.pipeline_libraries}

        - task_key: analyze_quarantine
          depends_on:
            - task_key: validate_data
          notebook_task:
            notebook_path: ./notebooks/quarantine_analyzer.py
            base_parameters:
              quarantine_table: "dqx_poc_dev.retail_dqx_poc.sales_quarantine"
              run_config_name: "sales_batch_rules"
              context_description: "Retail POS sales transactions from brick-and-mortar stores"
              llm_backend: "openrouter"
              top_n: "20"
          existing_cluster_id: ${var.cluster_id}
          libraries: ${var.pipeline_libraries}

        - task_key: run_report
          depends_on:
            - task_key: suggest_rules
            - task_key: analyze_quarantine
          notebook_task:
            notebook_path: ./notebooks/rule_effectiveness_report.py
            base_parameters:
              run_config_name: "sales_batch_rules"
              lookback_runs: "10"
          existing_cluster_id: ${var.cluster_id}
          libraries: ${var.pipeline_libraries}

        - task_key: check_alerts
          depends_on:
            - task_key: run_report
          notebook_task:
            notebook_path: ./notebooks/dq_alert_check.py
            base_parameters:
              run_config_name: "sales_batch_rules"
              lookback_runs: "10"
              secret_scope: "dqx-poc"
          existing_cluster_id: ${var.cluster_id}
          libraries: ${var.pipeline_libraries}

    dq_alert_check_streaming:
      name: "[RTM] DQ Alert Check (Streaming)"
      tasks:
        - task_key: check_alerts
          notebook_task:
            notebook_path: ./notebooks/dq_alert_check.py
            base_parameters:
              run_config_name: "streaming_event_rules"
              lookback_runs: "10"
              secret_scope: "dqx-poc"
          existing_cluster_id: ${var.cluster_id}
          libraries: ${var.pipeline_libraries}
      schedule:
        quartz_cron_expression: "0 */15 * * * ?"
        timezone_id: "UTC"
